name: Build portable Windows bundle

# Builds the same self-contained folder as the original PoseAssess_Portable
# (python311\ + venv\ + poseassess\ + models\ + run.bat), smoke-tests it after moving it to
# another folder (as a user would), and uploads it as a zip.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BUNDLE: ${{ github.workspace }}\build\PoseAssess_Portable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Copy Python into the bundle (python311\)
        shell: pwsh
        run: |
          $py = python -c "import sys; print(sys.base_prefix)"
          New-Item -ItemType Directory -Force $env:BUNDLE | Out-Null
          Copy-Item -Recurse $py "$env:BUNDLE\python311"
          & "$env:BUNDLE\python311\python.exe" --version

      - name: Create venv\ and install the pinned dependencies
        shell: pwsh
        run: |
          & "$env:BUNDLE\python311\python.exe" -m venv "$env:BUNDLE\venv"
          $vpy = "$env:BUNDLE\venv\Scripts\python.exe"
          & $vpy -m pip install --upgrade pip
          & $vpy -m pip install -r requirements-portable.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          # rtmlib / mediapipe may pull in opencv-python next to opencv-contrib-python: keep one cv2
          & $vpy -m pip uninstall -y opencv-python opencv-python-headless
          & $vpy -m pip install --force-reinstall --no-deps opencv-contrib-python==4.11.0.86
          & $vpy -m pip list

      - name: Add the application and the 2D-pose models
        shell: pwsh
        run: |
          Copy-Item -Recurse poseassess "$env:BUNDLE\poseassess"
          Get-ChildItem -Recurse -Directory -Filter __pycache__ "$env:BUNDLE\poseassess" | Remove-Item -Recurse -Force
          foreach ($f in 'run.bat', 'run_wii.bat', 'run_wii_viewer.bat', 'pack_with_openpose.bat', 'README_DEPLOY.txt', 'requirements-wii.txt', 'requirements-portable.txt') { Copy-Item $f $env:BUNDLE }
          if (Test-Path docs) { Copy-Item -Recurse docs "$env:BUNDLE\docs" }
          & "$env:BUNDLE\venv\Scripts\python.exe" .github\portable\fetch_models.py "$env:BUNDLE\models\rtmlib\hub\checkpoints"
          if ($LASTEXITCODE -ne 0) { throw "model download failed" }
          Get-ChildItem -Recurse -Filter *.zip "$env:BUNDLE\models" | Remove-Item -Force

      - name: Window size check (native Windows platform, fits a 1400 px wide screen area)
        shell: pwsh
        run: |
          $vpy = "$env:BUNDLE\venv\Scripts\python.exe"
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE"
          $env:QT_QPA_PLATFORM = 'windows'
          & $vpy .github\portable\gui_sizes.py --max 1400
          if ($LASTEXITCODE -ne 0) { throw "main window too wide" }

      - name: Tests with the bundle's Python
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $vpy = "$env:BUNDLE\venv\Scripts\python.exe"
          & $vpy -m pip install pytest
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE"
          $env:PYTHONFAULTHANDLER = "1"
          # One process per test file: a native crash is attributed to its file and does not
          # hide the results of the other files
          $failed = @()
          foreach ($f in (Get-ChildItem tests -Filter "test_*.py" | Sort-Object Name)) {
            Write-Host "::group::$($f.Name)"
            & $vpy -m pytest -v -rfEs -p no:cacheprovider $f.FullName
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0 -and $code -ne 5) { $failed += "$($f.Name) (exit $code)"; Write-Host "FAILED FILE: $($f.Name) exit $code" }
          }
          & $vpy -m pip uninstall -y pytest iniconfig pluggy
          if ($failed.Count) { throw "test files failed: $($failed -join ', ')" }

      - name: Move the bundle and smoke-test it like run.bat does
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $moved = "$env:RUNNER_TEMP\moved\PoseAssess_Portable"
          New-Item -ItemType Directory -Force (Split-Path $moved) | Out-Null
          Move-Item $env:BUNDLE $moved
          # run.bat step 1: point the venv at the bundled Python wherever the folder is
          @("home = $moved\python311", "include-system-site-packages = false", "version = 3.11.3",
            "executable = $moved\python311\python.exe") | Set-Content -Encoding ascii "$moved\venv\pyvenv.cfg"
          $env:PYTHONPATH = $moved
          Push-Location $moved
          & "$moved\venv\Scripts\python.exe" "$env:GITHUB_WORKSPACE\.github\portable\smoketest.py" $moved
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
          & "$moved\venv\Scripts\python.exe" -m poseassess.wii --simulate --seconds 2 --out "$env:RUNNER_TEMP\wii_selftest"
          if ($LASTEXITCODE -ne 0) { throw "Wii recorder failed" }
          $csv = Get-ChildItem -Recurse "$env:RUNNER_TEMP\wii_selftest" -Filter wii.csv | Select-Object -First 1
          if (-not $csv) { throw "wii.csv was not written" }
          Get-Content $csv.FullName -TotalCount 3
          Pop-Location
          # leave pyvenv.cfg as run.bat would rewrite it anyway; clean caches written by the test
          Get-ChildItem -Recurse -Directory -Filter __pycache__ "$moved\poseassess" | Remove-Item -Recurse -Force
          Move-Item $moved $env:BUNDLE

      - name: Zip
        shell: pwsh
        run: |
          Push-Location (Split-Path $env:BUNDLE)
          7z a -tzip -mx=5 "$env:GITHUB_WORKSPACE\PoseAssess_Portable_win64.zip" PoseAssess_Portable | Select-Object -Last 3
          Pop-Location
          "{0:N0} MB" -f ((Get-Item PoseAssess_Portable_win64.zip).Length / 1MB)

      - name: get_poseassess_with_openpose.bat unzips the artifact and packs (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bat = 'scripts\get_poseassess_with_openpose.bat'
          $inner = "$env:GITHUB_WORKSPACE\PoseAssess_Portable_win64.zip"
          $t = Join-Path $env:RUNNER_TEMP 'getpa'
          New-Item -ItemType Directory -Force "$t\dl", "$t\neg" | Out-Null
          "free on the temp drive: {0:N1} GB" -f ((Get-PSDrive ($env:RUNNER_TEMP.Substring(0, 1))).Free / 1GB)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($inner)
          $files = @($z.Entries | Where-Object { -not $_.FullName.EndsWith('/') })
          $longest = [int]($z.Entries | ForEach-Object { $_.FullName.Length - 'PoseAssess_Portable/'.Length } | Measure-Object -Maximum).Maximum
          $z.Dispose()
          "package zip: $($files.Count) files, longest name in PoseAssess_Portable: $longest characters"
          function Get-Leftovers($dir) {
            @(Get-ChildItem -LiteralPath $dir -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '_pa_unzip_*' -or $_.Name -like '_poseassess_*' })
          }
          # A stand-in OpenPose BODY_25B folder (dummy files; nothing is run)
          $op = "$t\fake_openpose"
          New-Item -ItemType Directory -Force "$op\bin", "$op\models\pose\body_25b" | Out-Null
          Set-Content -Encoding ascii "$op\bin\OpenPoseDemo.exe" 'stand-in'
          Set-Content -Encoding ascii "$op\bin\cudart64_110.dll" 'stand-in'
          Set-Content -Encoding ascii "$op\models\pose\body_25b\pose_deploy.prototxt" 'name: "stand-in"'
          Set-Content -Encoding ascii "$op\models\pose\body_25b\pose_iter_XXXXXX.caffemodel" 'stand-in'
          Set-Content -Encoding ascii "$op\LICENSE" 'stand-in license'

          # 1. Refusals change nothing: not a PoseAssess zip, a broken zip, an older build
          #    (no pack_with_openpose.bat), a too deep folder
          Set-Content -Encoding ascii "$t\neg\hello.txt" 'hello'
          Compress-Archive -Path "$t\neg\hello.txt" -DestinationPath "$t\neg\other.zip"
          [System.IO.File]::WriteAllBytes("$t\neg\broken.zip", [byte[]](80, 75, 3, 4, 20, 0, 0, 0, 1, 2, 3))
          New-Item -ItemType Directory -Force "$t\neg\oldbuild\PoseAssess_Portable" | Out-Null
          Set-Content -Encoding ascii "$t\neg\oldbuild\PoseAssess_Portable\run.bat" '@echo off'
          Compress-Archive -Path "$t\neg\oldbuild\PoseAssess_Portable" -DestinationPath "$t\neg\oldbuild.zip"
          $cases = @(@("$t\neg\other.zip", 'not a PoseAssess package', "$t\neg\o1", '-NoPack'),
                     @("$t\neg\broken.zip", 'not a readable zip', "$t\neg\o2", '-NoPack'),
                     @("$t\neg\oldbuild.zip", 'older PoseAssess build', "$t\neg\o3", "-OpenPose $op"))
          $deepLen = 240 - $longest   # dest + \_pa_unzip_<time>\ + longest > 259
          if ($deepLen -gt "$t\neg".Length + 2 -and $deepLen -lt 190) {
            $deep = "$t\neg\" + ('d' * ($deepLen - "$t\neg".Length - 1))
            $cases += , @($inner, 'too deep for Windows path length limits', $deep, '-NoPack')
          } else { "(too-deep case skipped: longest name $longest)" }
          foreach ($c in $cases) {
            if ($c.Count -ne 4) { throw "test case is not (zip, message, dest, args): $($c -join ' | ')" }
            $ErrorActionPreference = 'Continue'
            $out = cmd.exe /d /c "$bat -Zip $($c[0]) -Dest $($c[2]) $($c[3]) -Yes <NUL" | Out-String
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            Write-Host $out
            if ($code -eq 0) { throw "expected a refusal for $($c[0])" }
            if ($out -notmatch [regex]::Escape($c[1])) { throw "expected '$($c[1])' for $($c[0])" }
            if (Test-Path -LiteralPath "$($c[2])\PoseAssess_Portable") { throw "PoseAssess_Portable left behind for $($c[0])" }
            if ((Get-Leftovers $c[2]).Count) { throw "temporary files left behind for $($c[0]): $((Get-Leftovers $c[2]).Name -join ', ')" }
          }

          # 2. Unzip a browser download (a zip around PoseAssess_Portable_win64.zip), as a user
          #    starts it (stdin from NUL: the final pause returns at once)
          7z a -tzip -mx=0 "$t\dl\PoseAssess_Portable_win64.zip" $inner | Select-Object -Last 2
          cmd.exe /d /c "$bat -Zip $t\dl\PoseAssess_Portable_win64.zip -Dest $t\out -NoPack -Yes <NUL"
          if ($LASTEXITCODE -ne 0) { throw "get_poseassess_with_openpose.bat failed: exit $LASTEXITCODE" }
          $pa = "$t\out\PoseAssess_Portable"
          foreach ($f in 'run.bat', 'pack_with_openpose.bat', 'python311\python.exe', 'venv\Scripts\python.exe') {
            if (-not (Test-Path -LiteralPath "$pa\$f")) { throw "missing after unzip: $f" }
          }
          $got = @(Get-ChildItem -LiteralPath $pa -Recurse -Force | Where-Object { -not $_.PSIsContainer }).Count
          "files in the zip: $($files.Count), unzipped: $got"
          if ($got -ne $files.Count) { throw "unzipped file count differs" }
          if ((Get-Leftovers "$t\out").Count) { throw "temporary files left behind: $((Get-Leftovers "$t\out").Name -join ', ')" }
          Remove-Item -LiteralPath "$t\dl" -Recurse -Force

          # 3. The folder is there ([U] with -Yes): pack the stand-in OpenPose
          function Test-Packed($zipPath) {
            if (-not (Test-Path -LiteralPath $zipPath)) { throw "no $zipPath" }
            $z = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            $names = @($z.Entries | ForEach-Object { $_.FullName })
            $z.Dispose()
            foreach ($n in 'PoseAssess_Portable/run.bat', 'PoseAssess_Portable/openpose/bin/OpenPoseDemo.exe',
                           'PoseAssess_Portable/openpose/models/pose/body_25b/pose_iter_XXXXXX.caffemodel') {
              if ($names -notcontains $n) { throw "$n is not in $zipPath" }
            }
            "packed zip: $($names.Count) entries, {0:N0} MB" -f ((Get-Item -LiteralPath $zipPath).Length / 1MB)
          }
          cmd.exe /d /c "$bat -Dest $t\out -OpenPose $op -Yes <NUL"
          if ($LASTEXITCODE -ne 0) { throw "get_poseassess_with_openpose.bat (pack) failed: exit $LASTEXITCODE" }
          Test-Packed "$t\out\PoseAssess_Portable_with_OpenPose.zip"
          Remove-Item -LiteralPath "$t\out" -Recurse -Force

          # 4. An older build is there ([R] with -Yes): the new copy is unzipped next to it,
          #    the old folder is renamed (its data kept), then the new one is packed
          $r = "$t\r"
          New-Item -ItemType Directory -Force "$r\PoseAssess_Portable\recordings" | Out-Null
          Set-Content -Encoding ascii "$r\PoseAssess_Portable\run.bat" '@echo off'
          Set-Content -Encoding ascii "$r\PoseAssess_Portable\recordings\keep.txt" 'participant data'
          cmd.exe /d /c "$bat -Zip $inner -Dest $r -OpenPose $op -Yes <NUL"
          if ($LASTEXITCODE -ne 0) { throw "get_poseassess_with_openpose.bat ([R]) failed: exit $LASTEXITCODE" }
          $old = @(Get-ChildItem -LiteralPath $r -Directory -Filter 'PoseAssess_Portable_old_*')
          if ($old.Count -ne 1) { throw "expected one PoseAssess_Portable_old_* folder, found $($old.Count)" }
          if ((Get-Content -LiteralPath "$($old[0].FullName)\recordings\keep.txt") -ne 'participant data') { throw "old data changed" }
          if (-not (Test-Path -LiteralPath "$r\PoseAssess_Portable\pack_with_openpose.bat")) { throw "new copy not in place" }
          if ((Get-Leftovers $r).Count) { throw "temporary files left behind: $((Get-Leftovers $r).Name -join ', ')" }
          Test-Packed "$r\PoseAssess_Portable_with_OpenPose.zip"
          Remove-Item -LiteralPath $t -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PoseAssess_Portable_win64
          path: PoseAssess_Portable_win64.zip
          retention-days: 30
          compression-level: 0

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PoseAssess_Portable_win64.zip
